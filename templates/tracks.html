<!-- Home Page Content -->
{% extends "layout.html" %}
 {% block heading %}{% endblock %}
{% block body %}


  <!-- THE GALLERY GRID ---------------------------------------------------
       .gallery is a CSS Grid. Look at the rule in style.css: we never say
       how many columns there are. The browser fits as many as will hold
       240px and reflows on its own. No media queries needed. -->
  <ul class="gallery">

        {% for track in tracks %}

        <li class="tile">
            <!-- The WHOLE tile is one link, so the image and the caption are
                    both clickable. That is a much bigger target than a small
                    "view details" button, especially on a phone. -->
  

            <!-- Square crop: gallery tiles look wrong at mixed heights, so we
                ask Picsum for a square and let CSS crop it (see .tile img). -->
            <img src="{{ url_for('static', filename='images/' + track[3]) }}"
                alt="{{ track[2] }}"
                width="600" height="400" loading="lazy">

            <span class="tile-caption">
            <span class="badge">{{ track[2] }}</span>
            <span class="tile-title">{{ track[1] }}</span>
            </span>

            <iframe width="300" height="169" src="https://www.youtube.com/embed/N9omw44Z-U4?si=w6W5_OhHRb6H5WeQ" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            <iframe width="300" height="169" src="https://www.youtube.com/embed/A5GUWzbNSi0?si=Fni5pEvXeeiqYfYW" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

        </li>

        {% endfor %}

  </ul>
{% endblock %}
